name = "ares-crypto"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat_v2"]

[triggers]
crons = ["*/5 * * * *", "0 6 * * *", "0 7 * * *"]   # monitor 5 мин; feeds sync 06:00 UTC; дайджест 07:00 UTC

[[d1_databases]]
binding = "DB"
database_name = "ares"
database_id = "12bfcbd3-a7ed-4d9c-865f-c2358b39c0ba"     # wrangler d1 create ares -> paste id

[[kv_namespaces]]
binding = "CACHE"
id = "adb397a8acf7491d8d54614c0236d224"                 # wrangler kv namespace create CACHE

[[durable_objects.bindings]]
name = "TRACER_DO"
class_name = "TracerDO"

[[durable_objects.bindings]]
name = "MONITOR_DO"
class_name = "MonitorDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TracerDO", "MonitorDO"]

[vars]
# Non-secret config; secrets go via: wrangler secret put BOT_TOKEN  etc.
ADMIN_ID = "5188446459"
MINIAPP_URL = "https://ares-crypto.maks222berg.workers.dev"                        # CF Pages URL of /miniapp after deploy
OPENROUTER_MODEL = "baidu/ernie-5.5-flash-preview:free"                  # проверена 18.11: живая free-модель с хорошим русским
[assets]
directory = "../miniapp/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/tg-webhook", "/healthz", "/r/*"]   # share-страницы через воркер, не SPA-fallback
